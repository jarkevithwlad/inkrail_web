<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
<meta name="theme-color" content="#1b1d1b">
<meta name="description" content="Письменный стол с фактурной бумагой, звуками печатной машинки и библиотекой писем. Работает без интернета.">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'; base-uri 'none'; object-src 'none'; frame-src 'none'">
<title>Inkrail</title>
<link rel="icon" href="./assets/AppIcon.png"><link rel="stylesheet" href="./shell.css"><link rel="stylesheet" href="./desk.css"><link rel="stylesheet" href="./editor.css"><link rel="stylesheet" href="./panels.css">
<script type="module" src="./app.js"></script></head>
<body><main id="desk" aria-label="Письменный стол Inkrail"></main><div id="panels"></div>
<dialog id="notice" aria-labelledby="notice-title"><h2 id="notice-title">Сообщение Inkrail</h2><p id="notice-text"></p><button id="notice-ok" autofocus>Понятно</button></dialog>
<div id="commands" role="menu" aria-label="Команды для работы с письмами" hidden></div>
<div id="boot-message">Открываем письменный стол…</div>
<div id="app-update" hidden><span role="status">Доступна новая версия Inkrail.</span><button id="app-reload" type="button">Обновить</button></div>
<noscript>Для работы Inkrail включите JavaScript в браузере.</noscript>
<script src="./startup.js"></script>
</body></html>
